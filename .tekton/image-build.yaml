# docs-runme-tests 镜像构建流水线（Pipelines-as-Code）
#
# 依赖：仓库根 Dockerfile（Task 10 产物）、lynx/release-matrix.tsv、lynx/compute-tags.sh。
# 产物：推送到 build-harbor.alauda.cn/asm/docs-runme-tests 的镜像。
#
# 触发：目前只保留 PR 评论 /image-build 手动触发。
# docs-runme-tests 自身主干分支是 main（已用 git ls-remote --symref 核实，本地也只有
# main 分支）——不要与 Dockerfile 里 MESH_DOCS_REF=master 混淆，那是 servicemesh2-docs
# 这个外部文档仓库自己的默认分支，跟本仓库的主干分支是两回事，不在本文件改动范围内。
#
# 【上线前必须人工确认】pipelineRef.params 里 name / version 目前是占位符，不是真实值。
# 详见下面 pipelineRef 处的注释、文件末尾的退路方案，以及
# docs/superpowers/plans/2026-08-20-dailybuild-lynx-integration.md 顶部的
# 「执行期修订记录」与 Task 11 一节。
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: docs-runme-tests-image-build
  annotations:
    # push 触发有意暂时关闭：pipelineRef.params.name/version 还是占位符（见上方
    # 注释），一旦放开 push 触发，本分支合入 main 后下一次 push 到 main 就会创建
    # 一条解析失败的 PipelineRun，在 git 侧留下持续复现的红 check。
    # 等拿到 CI/发版团队确认的真实 pipeline name/version、把占位符换掉后，再把
    # 下面这条 on-cel-expression 加回来即可恢复 push 触发，判断分支用这条原始
    # 正则（push 到 main 或 release-mesh-<x.y> 分支，且提交信息不含 "ci skip"）：
    #   pipelinesascode.tekton.dev/on-cel-expression: |-
    #     (
    #       event == "push" &&
    #       !last_commit_title.contains("ci skip") &&
    #       source_branch.matches("^(main|release-mesh-[0-9]+([.][0-9]+)+)$")
    #     )
    pipelinesascode.tekton.dev/on-comment: "^(/image-build)$"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  timeouts:
    pipeline: 2h
    tasks: 1h

  params:
    # 下面三个是 PaC 触发时自动注入的变量，写法与
    # ../servicemesh2-docs/.tekton/doc-build.yaml 保持一致
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ source_branch }}"
    - name: git-commit
      value: "{{ revision }}"

    # 下面是本流水线自己的构建参数
    - name: image-repo
      value: build-harbor.alauda.cn/asm/docs-runme-tests
    - name: dockerfile
      value: Dockerfile
    - name: platforms
      value: linux/amd64

    # 有意不在这里放 "image-tags" 参数：Tekton PipelineRun 的 params 只能是触发时的
    # 静态值（PaC 的 "{{ }}" 变量或写死的字面量），没有办法在这里内嵌"运行
    # lynx/compute-tags.sh 拿 stdout"这种触发时求值的逻辑。tag 计算只能在 Pipeline
    # 内部由某个 Task 步骤实际执行 lynx/compute-tags.sh、把结果写成 Tekton Result，
    # 再让构建 Task 消费——这正是下面 pipelineRef 注释里提到的"构建前置步骤"，具体怎么
    # 接入取决于 pipelineRef 引用的真实 Pipeline 长什么样（同一个待确认问题的另一面）。
    # 文件末尾的退路 pipelineSpec 里给出了这段接线的完整可跑示例。

  # ============================================================================
  # 【待确认，不能直接上线】
  # 下面 resolver: hub + catalog/kind/name/version 四个 param 的结构，已经用同组织
  # 现存的真实样例核对过，可信：
  #   ../servicemesh2-docs/.tekton/doc-build.yaml
  #   ../opentelemetry-docs/.tekton/doc-build.yaml（与 servicemesh2-docs 一致，仅
  #     doc-base 参数值不同）
  #   ../distributed-tracing-docs/.tekton/doc-build.yaml（同上）
  # 它们的 pipelineRef 没有 "type: tekton" 这个 param，但有 "version"；本文件已按
  # 这个真实结构写（这点上面三个仓库互相一致，可信度高）。
  #
  # 但 name / version 具体填什么——本仓库找不到答案，只能标占位符，理由：
  #   - 上面三个文档仓库用的 name 是 product-docs-pipeline / product-docs-pr-pipeline
  #     （version "0.1"），这是"拉 yarn 站点生成静态文档"的流水线，跟"拿 Dockerfile
  #     跑 buildah build+push"完全是两回事，不能照抄。
  #   - 同一批仓库里另外能找到的 hub pipeline 样例——
  #     registry/experimental/.tekton/harbor-robot-gen/harbor-robot-gen.yaml 与
  #     registry-gateway/registry-gateway.yaml，用的是 ko-build-and-push-chart
  #     （version "0.1"）——这是 Go 项目专用的 `ko` 构建流水线（连带发 Helm Chart），
  #     同样不是通用的"Dockerfile + buildah"流水线，也不能照抄。
  #   - 已对本机能读到的所有 .tekton/*.yaml 做过穷举扫描（用 python3 yaml 解析每个
  #     pipelineRef.resolver == hub 的文件），没有发现第三种、更贴近"通用镜像构建"的
  #     alauda catalog pipeline 名字。
  #   - "组织的 alauda catalog 里到底有没有一条通用镜像构建 pipeline、叫什么名字、
  #     什么版本" 这件事本身查不到（没有 Tekton Hub / 集群访问权限去枚举 catalog），
  #     不能凭印象编一个看起来合理的名字（例如 "buildah-build-push"——这是上一轮
  #     写计划时猜的，已确认不可信，不要用）。
  #
  # 需要向 CI/发版团队确认：alauda catalog 里是否存在一条通用的"Dockerfile 镜像
  # 构建 + 推送到 build-harbor"流水线；如果有，把下面 name/version 换成真实值即可，
  # 其余结构不用大改。如果没有，退路见本文件末尾大段注释：改用内联 pipelineSpec，
  # 自带一个 buildah 构建步骤（已用 WebFetch 核对过其中引用的公开镜像/命令是真实的，
  # 但没有在真实集群跑过，上线前仍需实测）。
  # ============================================================================
  pipelineRef:
    resolver: hub
    params:
      - name: catalog
        value: alauda
      - name: kind
        value: pipeline
      - name: name
        value: "TODO-CONFIRM-WITH-CI-TEAM"  # 占位符，不是真实 pipeline 名，见上方注释
      - name: version
        value: "TODO-CONFIRM-WITH-CI-TEAM"  # 占位符，不是真实版本号，见上方注释

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

    # 与 doc-build.yaml 一致：这个 secret 由 pac controller 在触发时自动替换
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"

  taskRunTemplate:
    # 沿用 doc-build.yaml 的默认约定：多数构建类 Task（尤其 buildah）需要 root 权限。
    # 若确认后的真实 Pipeline 内部有自己的 git-clone Task 且需要非 root 覆盖
    # （doc-build.yaml 就是这么做的），到时候再按其 pipelineTaskName 补 taskRunSpecs。
    podTemplate:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: "OnRootMismatch"

