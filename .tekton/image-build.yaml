# docs-runme-tests 镜像构建流水线（Pipelines-as-Code）
#
# 依赖：仓库根 Dockerfile、lynx/release-matrix.tsv、lynx/compute-tags.sh、lynx/docs-refs.tsv。
# 产物：推送到 build-harbor.alauda.cn/asm/docs-runme-tests 的镜像。
#
# 触发：
#   - push 到 main / release-mesh-<x.y>（提交信息含 "ci skip" 的除外）
#   - 任意分支的 PR 上评论 /image-build（四仓联合改动合入前，用它出一份可真跑的镜像）
#
# 为什么用内联 pipelineSpec 而不是 pipelineRef + hub catalog：
#   本组织的 alauda catalog 里能查到的 pipeline 只有两类——product-docs-pipeline
#   （yarn 生成静态文档站点）和 ko-build-and-push-chart（Go 项目专用的 ko 构建），
#   都不是"拿 Dockerfile 跑 buildah build+push"。已对工作区内全部 .tekton/*.yaml
#   做过穷举扫描，没有第三种更贴近的通用镜像构建 pipeline，也没有权限枚举 catalog。
#   与其填一个猜出来的 pipeline 名（那样每次触发都会卡在 hub resolver 阶段失败），
#   不如把编排写实：只引用一个已被本组织现存流水线验证过的 hub task
#   （extras/git-clone:0.10，见 ../acp/base-init-chart/.tekton/acp-base-init-chart.yaml），
#   其余步骤自带 taskSpec，不依赖任何待确认的名字。
#
# 【上线前仍需人工确认的唯一一项】推送镜像的凭据。
#   本文件按 Tekton 标准做法处理：不声明 registry workspace，依赖 Tekton 的
#   creds-init——给流水线用的 ServiceAccount 挂一个带 `tekton.dev/docker-0:
#   https://build-harbor.alauda.cn` 注解的 docker registry Secret，Tekton 会自动
#   写进容器的 ~/.docker/config.json，buildah 直接就能 push（官方 tektoncd/catalog
#   的 buildah Task 也是这个机制，本身不带 registry workspace）。
#   若本仓库对应的 PaC Repository 所在命名空间尚未配好该 Secret，第一次构建会在
#   buildah push 步骤报 401——那是配置缺失，不是本文件的编排问题。
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: docs-runme-tests-image-build
  annotations:
    pipelinesascode.tekton.dev/on-comment: "^(/image-build)$"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    # 分支白名单需与 lynx/release-matrix.tsv 的登记集合保持一致，
    # 否则会出现"能触发构建但 tag 算不出来"或反过来"登记了却触发不了"。
    pipelinesascode.tekton.dev/on-cel-expression: |-
      (
        event == "push" &&
        !last_commit_title.contains("ci skip") &&
        source_branch.matches("^(main|release-mesh-[0-9]+([.][0-9]+)+)$")
      )
spec:
  timeouts:
    pipeline: 2h
    tasks: 1h

  params:
    # 下面四个是 PaC 触发时自动注入的变量，写法与
    # ../servicemesh2-docs/.tekton/doc-build.yaml 保持一致
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ source_branch }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"

    # 本流水线自己的构建参数
    - name: image-repo
      value: build-harbor.alauda.cn/asm/docs-runme-tests
    - name: dockerfile
      value: Dockerfile
    # buildah 镜像做成参数：构建集群若拉不到 quay.io，换成内网镜像即可，
    # 不用动下面的编排逻辑（官方 buildah Task 的 BUILDER_IMAGE 也是这么设计的）
    - name: builder-image
      value: quay.io/buildah/stable:v1

    # 注：image-tags 与三个文档仓库 ref 都不在这里写死。
    # PipelineRun 的 params 只能是触发时的静态值，没法在这里内嵌"跑一段脚本取 stdout"。
    # tag 由 prepare 这个 Task 实际执行 lynx/compute-tags.sh 算出来，
    # 文档 ref 由同一个 Task 从 lynx/docs-refs.tsv 读出来，都写成 Tekton Result
    # 供 build-push 消费。

  pipelineSpec:
    params:
      - name: git-url
      - name: git-revision
      - name: git-commit
      - name: pull-request-number
        default: ""
      - name: image-repo
      - name: dockerfile
      - name: builder-image
    workspaces:
      - name: source
      - name: basic-auth
    tasks:
      - name: git-clone
        taskRef:
          resolver: hub
          params:
            - name: catalog
              value: extras
            - name: kind
              value: task
            - name: name
              value: git-clone
            - name: version
              value: '0.10'
        params:
          - name: url
            value: "$(params.git-url)"
          - name: revision
            value: "$(params.git-revision)"
          - name: prNumber
            value: "$(params.pull-request-number)"
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth

      # 一步算出「打什么 tag」与「用哪三个文档 ref」，都来自仓库内被 CI 校验过的
      # 清单文件（compute-tags.sh + docs-refs.tsv），不在流水线里另写一份规则。
      - name: prepare
        runAfter: ["git-clone"]
        taskSpec:
          params:
            - name: branch
            - name: commit
          results:
            - name: image-tags
              description: 逗号分隔的镜像 tag 列表，来自 lynx/compute-tags.sh
            - name: mesh-docs-ref
              description: servicemesh2-docs 的 ref，来自 lynx/docs-refs.tsv
            - name: otel-docs-ref
              description: opentelemetry-docs 的 ref，来自 lynx/docs-refs.tsv
            - name: tracing-docs-ref
              description: distributed-tracing-docs 的 ref，来自 lynx/docs-refs.tsv
          workspaces:
            - name: source
          steps:
            - name: compute
              image: bash:5
              script: |
                #!/usr/bin/env bash
                # Tekton 对没有 shebang 的 script 默认套 #!/bin/sh；这里显式要 bash
                set -eu
                cd "$(workspaces.source.path)"

                # 先把 Tekton 的 $(results.*.path) 落到普通 shell 变量，
                # 避免下面出现 $( $(...) ) 这种 Tekton 变量与命令替换的嵌套写法
                OUT_TAGS="$(results.image-tags.path)"
                OUT_MESH="$(results.mesh-docs-ref.path)"
                OUT_OTEL="$(results.otel-docs-ref.path)"
                OUT_TRACING="$(results.tracing-docs-ref.path)"

                bash lynx/check-docs-refs.sh

                bash lynx/compute-tags.sh "$(params.branch)" "$(params.commit)" \
                    | tr -d '\n' > "${OUT_TAGS}"

                ref_of() {
                  awk -F'\t' -v k="$1" '!/^#/ && $1 == k {printf "%s", $2; exit}' lynx/docs-refs.tsv
                }
                ref_of MESH_DOCS_REF    > "${OUT_MESH}"
                ref_of OTEL_DOCS_REF    > "${OUT_OTEL}"
                ref_of TRACING_DOCS_REF > "${OUT_TRACING}"

                # 空 result 说明清单被改坏了（check-docs-refs.sh 应该已经拦住），保险起见再断一次
                test -s "${OUT_TAGS}" && test -s "${OUT_MESH}" && test -s "${OUT_OTEL}" && test -s "${OUT_TRACING}"

                echo "本次镜像的四仓组合："
                echo "  tags   : $(cat "${OUT_TAGS}")"
                echo "  mesh   : $(cat "${OUT_MESH}")"
                echo "  otel   : $(cat "${OUT_OTEL}")"
                echo "  tracing: $(cat "${OUT_TRACING}")"
        params:
          - name: branch
            value: "$(params.git-revision)"
          - name: commit
            value: "$(params.git-commit)"
        workspaces:
          - name: source
            workspace: source

      - name: build-push
        runAfter: ["prepare"]
        taskSpec:
          params:
            - name: image-repo
            - name: dockerfile
            - name: builder-image
            - name: image-tags
            - name: mesh-docs-ref
            - name: otel-docs-ref
            - name: tracing-docs-ref
          workspaces:
            - name: source
          steps:
            # 没有直接 taskRef 官方的 buildah Task：它的 IMAGE 参数只认单个 tag，
            # 一次调用打不出 compute-tags.sh 产出的逗号分隔多 tag 列表。这里对 tag
            # 循环加 -t，一次 bud、多次 push。
            - name: buildah-bud-push
              image: $(params.builder-image)
              securityContext:
                privileged: true
              script: |
                #!/usr/bin/env bash
                # 必须显式声明 bash：下面用到数组与 <<< here-string，
                # Tekton 默认套的 #!/bin/sh 在多数构建镜像里是 dash/ash，会直接语法错误
                set -eux
                cd "$(workspaces.source.path)"

                IFS=',' read -ra TAGS <<< "$(params.image-tags)"
                TAG_ARGS=()
                for t in "${TAGS[@]}"; do
                  TAG_ARGS+=(-t "$(params.image-repo):${t}")
                done

                buildah bud \
                    --build-arg "IMAGE_TAG=${TAGS[0]}" \
                    --build-arg "MESH_DOCS_REF=$(params.mesh-docs-ref)" \
                    --build-arg "OTEL_DOCS_REF=$(params.otel-docs-ref)" \
                    --build-arg "TRACING_DOCS_REF=$(params.tracing-docs-ref)" \
                    -f "$(params.dockerfile)" "${TAG_ARGS[@]}" .

                for t in "${TAGS[@]}"; do
                  ref="$(params.image-repo):${t}"
                  buildah push "${ref}" "docker://${ref}"
                done
        params:
          - name: image-repo
            value: "$(params.image-repo)"
          - name: dockerfile
            value: "$(params.dockerfile)"
          - name: builder-image
            value: "$(params.builder-image)"
          - name: image-tags
            value: "$(tasks.prepare.results.image-tags)"
          - name: mesh-docs-ref
            value: "$(tasks.prepare.results.mesh-docs-ref)"
          - name: otel-docs-ref
            value: "$(tasks.prepare.results.otel-docs-ref)"
          - name: tracing-docs-ref
            value: "$(tasks.prepare.results.tracing-docs-ref)"
        workspaces:
          - name: source
            workspace: source

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi

    # 与 doc-build.yaml 一致：这个 secret 由 pac controller 在触发时自动替换
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"

  taskRunTemplate:
    # 沿用 doc-build.yaml 的默认约定：构建类 Task（尤其 buildah）需要 root。
    podTemplate:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: "OnRootMismatch"

  taskRunSpecs:
    # 与 doc-build.yaml 一致：git-clone 用非 root 跑。
    - pipelineTaskName: git-clone
      podTemplate:
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          fsGroupChangePolicy: "OnRootMismatch"
    - pipelineTaskName: build-push
      computeResources:
        requests:
          cpu: 2
          memory: 4Gi
        limits:
          cpu: 4
          memory: 8Gi
